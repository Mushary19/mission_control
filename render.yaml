# One web service built from the Dockerfile. The image never contains the raw export (.dockerignore), so the
# hosted app works but "Proof" says "Raw data not available on this server" unless a private disk holds the
# export and MC_DATA_DIR points at it.
services:
  - type: web
    name: mission-control
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: MC_CORS
        value: ""
    # Feedback is stored in SQLite inside the container and is lost on redeploy on the free plan.
    # For a longer demo add a disk (paid plan) and point MC_DB / MC_FEEDBACK_JSONL at it:
    # disk: { name: feedback, mountPath: /var/lib/mission-control, sizeGB: 1 }
